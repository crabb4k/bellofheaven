<!doctype html>
<html lang="mn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Bell of Heaven — Methodist Christian Church. Grace. Faith. Holiness. Love. Service. Community.">
  <title>Bell of Heaven — Methodist Christian Church</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --navy:#071525;--blue:#123b63;--white:#f7f9fc;--ivory:#f3eee5;
      --gold:#d6b56d;--light:#fff4cf;--muted:#8da0b7;
      --line:rgba(255,255,255,.14);--shadow:0 25px 80px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box} html{scroll-behavior:smooth}
    body{margin:0;background:var(--navy);color:var(--white);font-family:Inter,"Noto Sans KR",system-ui,sans-serif}
    html[lang="ko"] body{font-family:"Noto Sans KR",Inter,system-ui,sans-serif}
    html[lang="ko"] .section-title,html[lang="ko"] .hero h2,html[lang="ko"] .welcome h1{letter-spacing:-.02em}
    a{color:inherit;text-decoration:none} button{font:inherit}

    /* ===================== OPENING (pure CSS + SVG) ===================== */
    .welcome{position:fixed;inset:0;z-index:1000;overflow:hidden;
      background:linear-gradient(180deg,#030a15 0%,#0a1e34 26%,#153a5c 48%,#2b5c84 74%,#6c93ac 100%);
      display:grid;place-items:center;transition:opacity 1.2s ease,visibility 1.2s}
    .welcome.exit{opacity:0;visibility:hidden;pointer-events:none}

    .opening-visual{position:absolute;inset:0;overflow:hidden}

    /* Soft cloud banks — layered, blurred radial blobs drifting at different
       speeds. No canvas, no GPU shader: pure CSS, so it renders identically
       everywhere and stays crisp at any resolution. */
    .cloud-layer{position:absolute;inset:-10% -10%;pointer-events:none;will-change:transform}
    .cloud-layer i{position:absolute;border-radius:50%;filter:blur(46px);opacity:.75;background:
      radial-gradient(circle at 35% 35%,rgba(255,255,255,.95),rgba(255,255,255,.55) 45%,rgba(210,225,240,0) 72%)}
    .layer-back{animation:drift-a 96s ease-in-out infinite alternate}
    .layer-back i:nth-child(1){width:46vw;height:22vw;left:-8%;top:58%;opacity:.4}
    .layer-back i:nth-child(2){width:38vw;height:18vw;left:52%;top:66%;opacity:.32}
    .layer-back i:nth-child(3){width:50vw;height:20vw;left:24%;top:74%;opacity:.36}
    .layer-mid{animation:drift-b 62s ease-in-out infinite alternate}
    .layer-mid i:nth-child(1){width:40vw;height:17vw;left:-6%;top:66%;opacity:.62}
    .layer-mid i:nth-child(2){width:34vw;height:15vw;left:60%;top:72%;opacity:.55}
    .layer-mid i:nth-child(3){width:44vw;height:16vw;left:30%;top:80%;opacity:.6}
    .layer-front{animation:drift-c 40s ease-in-out infinite alternate}
    .layer-front i:nth-child(1){width:34vw;height:13vw;left:-4%;top:78%;opacity:.85;filter:blur(28px)}
    .layer-front i:nth-child(2){width:30vw;height:12vw;left:64%;top:82%;opacity:.8;filter:blur(28px)}
    .layer-front i:nth-child(3){width:38vw;height:14vw;left:34%;top:86%;opacity:.82;filter:blur(28px)}
    @keyframes drift-a{from{transform:translateX(-2%)}to{transform:translateX(2%)}}
    @keyframes drift-b{from{transform:translateX(3%)}to{transform:translateX(-3%)}}
    @keyframes drift-c{from{transform:translateX(-4%)}to{transform:translateX(4%)}}

    /* Warm glow seated behind the bell, standing in for a light source. */
    .godlight{position:absolute;left:50%;top:40%;width:70vmin;height:70vmin;transform:translate(-50%,-50%);
      background:radial-gradient(circle,rgba(255,244,214,.5) 0%,rgba(255,230,170,.22) 32%,rgba(255,230,170,0) 68%);
      opacity:0;transition:opacity 1.8s ease;pointer-events:none}
    .welcome.lit .godlight{opacity:1}

    /* Slowly rotating sunburst rays, masked to a soft circle. */
    .rays{position:absolute;left:50%;top:42%;width:130vmin;height:130vmin;transform:translate(-50%,-50%);
      background:repeating-conic-gradient(from 0deg,rgba(255,244,214,.16) 0deg 3deg,transparent 3deg 13deg);
      -webkit-mask-image:radial-gradient(circle,#000 8%,transparent 46%);
      mask-image:radial-gradient(circle,#000 8%,transparent 46%);
      opacity:0;animation:spin 130s linear infinite;transition:opacity 1.4s ease;pointer-events:none}
    .welcome.lit .rays{opacity:.55}
    .welcome.struck .rays{opacity:1;transition:opacity .25s ease}
    @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}

    /* The bell itself. */
    .bell-wrap{position:absolute;left:50%;top:38%;width:min(34vw,320px);
      transform:translate(-50%,-50%) scale(.2) translateY(40px);opacity:0;filter:blur(10px);
      transition:opacity 1.9s cubic-bezier(.19,1,.22,1),transform 1.9s cubic-bezier(.19,1,.22,1),filter 1.9s ease;
      transform-origin:50% 6%;will-change:transform}
    .welcome.bell-in .bell-wrap{transform:translate(-50%,-50%) scale(1) translateY(0);opacity:1;filter:blur(0)}
    .welcome.struck .bell-wrap{animation:bell-swing 1.7s cubic-bezier(.22,.9,.28,1) 1}
    @keyframes bell-swing{
      0%{transform:translate(-50%,-50%) rotate(0deg)}
      8%{transform:translate(-50%,-50%) rotate(7deg)}
      22%{transform:translate(-50%,-50%) rotate(-5.5deg)}
      38%{transform:translate(-50%,-50%) rotate(3.2deg)}
      55%{transform:translate(-50%,-50%) rotate(-1.6deg)}
      75%{transform:translate(-50%,-50%) rotate(.6deg)}
      100%{transform:translate(-50%,-50%) rotate(0deg)}
    }
    .bell-svg{width:100%;height:auto;display:block;filter:drop-shadow(0 22px 34px rgba(0,0,0,.45))}
    .bell-clapper{transform-origin:130px 118px;transition:transform .3s ease}
    .welcome.struck .bell-clapper{animation:clap 1.7s cubic-bezier(.22,.9,.28,1) 1}
    @keyframes clap{
      0%{transform:rotate(0deg)} 8%{transform:rotate(-13deg)} 22%{transform:rotate(9deg)}
      38%{transform:rotate(-5deg)} 55%{transform:rotate(2.4deg)} 100%{transform:rotate(0deg)}
    }

    /* Full-frame flash at the moment of the strike. */
    .flash{position:absolute;inset:0;z-index:2;opacity:0;pointer-events:none;
      background:radial-gradient(circle at 50% 40%,#fffaf0,rgba(255,244,214,.5) 30%,transparent 68%)}
    .welcome.struck .flash{animation:flash-pulse 1.1s ease-out 1}
    @keyframes flash-pulse{0%{opacity:0}14%{opacity:.9}100%{opacity:0}}

    /* A few drifting light motes for depth. */
    .motes{position:absolute;inset:0;pointer-events:none}
    .motes i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff6da;
      opacity:0;box-shadow:0 0 8px 2px rgba(255,244,214,.7);animation:mote-rise linear infinite}
    @keyframes mote-rise{0%{opacity:0;transform:translateY(0)}12%{opacity:.8}88%{opacity:.5}100%{opacity:0;transform:translateY(-38vh)}}

    .vignette{position:absolute;inset:0;z-index:1;pointer-events:none;
      background:radial-gradient(circle at 50% 42%,transparent 24%,rgba(4,14,26,.22) 58%,rgba(3,10,20,.74) 100%)}
    .welcome::after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;
      background:linear-gradient(180deg,rgba(4,14,26,.46),transparent 30%,transparent 58%,rgba(3,10,20,.8))}
    .welcome-content{position:relative;z-index:4;text-align:center;max-width:920px;padding:30px 24px}

    /* Each line arrives on its own cue from the opening timeline. */
    .stage{opacity:0;transform:translateY(24px);filter:blur(7px);
      transition:opacity 1.15s ease,transform 1.15s cubic-bezier(.19,1,.22,1),filter 1.15s ease}
    .stage.show{opacity:1;transform:none;filter:none}

    .eyebrow{font-size:11px;letter-spacing:.42em;text-transform:uppercase;color:#dbe6f2;margin-bottom:22px}
    .welcome h1{font-family:Manrope,sans-serif;font-size:clamp(38px,7.2vw,96px);line-height:.94;
      letter-spacing:-.055em;margin:0;font-weight:800;text-shadow:0 10px 50px rgba(0,0,0,.5)}
    .welcome h1 span{display:block;color:#fff}
    .welcome .sub{margin:20px auto 10px;font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold)}
    .welcome .verse{max-width:660px;margin:18px auto 32px;color:#e9f0f7;font-family:Manrope,"Noto Sans KR",sans-serif;
      font-size:clamp(15px,2vw,19px);line-height:1.75;text-shadow:0 2px 20px rgba(0,0,0,.45)}
    .enter{border:1px solid rgba(255,255,255,.34);background:rgba(255,255,255,.1);backdrop-filter:blur(18px);
      color:#fff;border-radius:999px;padding:16px 38px;cursor:pointer;letter-spacing:.24em;
      text-transform:uppercase;font-size:12px;box-shadow:0 14px 45px rgba(0,0,0,.3);transition:.35s}
    .enter:hover{transform:translateY(-3px) scale(1.04);border-color:rgba(255,244,207,.85);
      box-shadow:0 0 55px rgba(255,230,160,.3)}
    .scroll-note{position:absolute;z-index:4;bottom:30px;left:50%;transform:translateX(-50%);
      font-size:10px;letter-spacing:.28em;text-transform:uppercase;color:#93a6bc}
    .scroll-note::before{content:"";display:block;width:1px;height:30px;background:linear-gradient(var(--gold),transparent);margin:0 auto 10px}
    .skip{position:absolute;z-index:5;top:24px;right:5vw;background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(10px);color:#dbe5f0;border-radius:999px;
      padding:9px 20px;font-size:10px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;
      opacity:0;transition:opacity .5s ease,background .25s}
    .skip.show{opacity:.72}.skip:hover{opacity:1;background:rgba(255,255,255,.16)}

    /* Language picker, offered before entering. */
    .lang-pick{position:absolute;z-index:5;top:24px;left:5vw;display:flex;align-items:center;gap:8px;
      opacity:0;transition:opacity .5s ease}
    .lang-pick.show{opacity:1}
    .lang-pick .lp-label{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:#8fa3ba;margin-right:4px}
    .lang-btn{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);
      color:#cfdbe8;border-radius:999px;padding:7px 15px;font-size:11px;letter-spacing:.08em;cursor:pointer;transition:.25s}
    .lang-btn:hover{color:#fff;background:rgba(255,255,255,.15)}
    .lang-btn.active{background:rgba(255,244,207,.18);border-color:rgba(214,181,109,.75);color:var(--light)}

    @media(prefers-reduced-motion:reduce){
      .cloud-layer,.rays,.motes i{animation:none!important}
      .bell-wrap{transition:opacity .3s ease!important;filter:none!important}
      .welcome.bell-in .bell-wrap{transform:translate(-50%,-50%) scale(1)!important}
      .welcome.struck .bell-wrap,.welcome.struck .bell-clapper{animation:none!important}
      .stage{transition:opacity .3s ease!important;transform:none!important;filter:none!important}
    }
    @media(max-width:800px){
      .bell-wrap{width:min(52vw,260px);top:36%}
      .godlight,.rays{top:38%}
      .cloud-layer i{filter:blur(30px)}
    }

    /* ===================== SITE ===================== */
    header{position:fixed;top:0;left:0;right:0;z-index:50;padding:18px 5vw;transition:.3s}
    header.scrolled{background:rgba(7,21,37,.82);backdrop-filter:blur(18px);border-bottom:1px solid rgba(255,255,255,.08)}
    nav{max-width:1280px;margin:auto;display:flex;align-items:center;justify-content:space-between;gap:20px}
    .brand{display:flex;align-items:center;gap:12px;font-family:Manrope;font-weight:800;letter-spacing:.08em;font-size:13px}
    .brand-mark{width:34px;height:34px;border:1px solid rgba(214,181,109,.55);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-size:16px}
    .links{display:flex;gap:26px;align-items:center}
    .links a{font-size:11px;letter-spacing:.14em;color:#c7d2df;transition:.25s}.links a:hover{color:#fff}
    .nav-cta{padding:10px 16px;border:1px solid rgba(214,181,109,.5);border-radius:999px;color:var(--light)!important}
    .lang-switch{display:flex;gap:2px;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:3px}
    .lang-switch button{background:none;border:0;color:#9db0c4;padding:5px 11px;border-radius:999px;
      font-size:10px;letter-spacing:.1em;cursor:pointer;transition:.25s}
    .lang-switch button:hover{color:#fff}
    .lang-switch button.active{background:rgba(255,244,207,.16);color:var(--light)}
    .menu{display:none;background:none;border:0;color:white;font-size:25px}
    main{overflow:hidden}
    .hero{min-height:100vh;position:relative;display:grid;align-items:end;padding:150px 7vw 90px;
      background:radial-gradient(circle at 75% 30%,rgba(18,59,99,.75),transparent 35%),linear-gradient(135deg,#071525 0%,#0b243d 58%,#071525 100%)}
    .hero-grid{max-width:1280px;width:100%;margin:auto;display:grid;grid-template-columns:1.1fr .9fr;gap:60px;align-items:end}
    .hero h2{font-family:Manrope,"Noto Sans KR",sans-serif;font-size:clamp(44px,7.6vw,104px);line-height:.92;letter-spacing:-.065em;margin:0 0 25px}
    .hero h2 em{font-style:normal;color:var(--gold)}
    .hero p{max-width:620px;color:#b9c8d8;line-height:1.8;font-size:16px}
    .actions{display:flex;gap:12px;margin-top:30px;flex-wrap:wrap}
    .btn{padding:14px 20px;border-radius:999px;border:1px solid rgba(255,255,255,.18);font-size:11px;letter-spacing:.16em;text-transform:uppercase;transition:.3s}
    .btn.primary{background:#f7f9fc;color:#071525}.btn:hover{transform:translateY(-3px)}
    .architecture{height:430px;border-radius:28px;position:relative;overflow:hidden;border:1px solid var(--line);box-shadow:var(--shadow);
      background:linear-gradient(135deg,rgba(255,244,207,.12),transparent 35%),
      repeating-linear-gradient(90deg,rgba(255,255,255,.035) 0 1px,transparent 1px 72px),
      radial-gradient(circle at 52% 45%,rgba(255,244,207,.22),transparent 22%),#0b2036}
    .architecture:before{content:"";position:absolute;left:18%;right:18%;bottom:-16%;height:85%;border:2px solid rgba(255,255,255,.15);border-bottom:0;border-radius:48% 48% 0 0;box-shadow:inset 0 0 80px rgba(255,244,207,.08)}
    .architecture:after{content:"";position:absolute;width:35%;height:65%;left:32.5%;bottom:-10%;background:linear-gradient(90deg,transparent,rgba(255,244,207,.2),transparent);filter:blur(18px);transform:skewX(-8deg)}
    section{padding:115px 7vw}.section-inner{max-width:1280px;margin:auto}
    .kicker{font-size:10px;letter-spacing:.35em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
    .section-title{font-family:Manrope,"Noto Sans KR",sans-serif;font-size:clamp(32px,5vw,64px);letter-spacing:-.05em;line-height:1.05;margin:0 0 24px}
    .intro{max-width:690px;color:#9fb0c2;line-height:1.8}
    .about{background:var(--white);color:var(--navy)}.about .intro{color:#607084}
    .values{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#dbe2e9;margin-top:55px;border:1px solid #dbe2e9}
    .value{background:#f7f9fc;padding:38px;min-height:230px;transition:.3s}.value:hover{transform:translateY(-5px);box-shadow:0 15px 40px rgba(7,21,37,.1)}
    .num{font-size:11px;color:#a38a50;letter-spacing:.2em}
    .value h3{font-family:Manrope,"Noto Sans KR",sans-serif;font-size:25px;margin:42px 0 10px}
    .value p{font-size:13px;line-height:1.7;color:#647386}
    .faith{background:linear-gradient(180deg,#071525,#0b2137)}
    .faith-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:50px}
    .faith-card{padding:34px 28px;border-radius:20px;border:1px solid var(--line);background:linear-gradient(150deg,rgba(255,255,255,.06),rgba(255,255,255,.015));transition:.35s}
    .faith-card:hover{transform:translateY(-6px);border-color:rgba(214,181,109,.4)}
    .faith-card .fc-en{font-family:Manrope;font-size:12px;letter-spacing:.2em;color:var(--gold)}
    .faith-card h3{font-family:Manrope,"Noto Sans KR",sans-serif;font-size:26px;margin:10px 0 12px}
    .faith-card p{font-size:13px;line-height:1.65;color:#91a4b8;margin:0}
    .verse-section{position:relative;padding:130px 7vw;text-align:center;background:radial-gradient(circle at 50% 40%,rgba(18,59,99,.55),#050d18 65%);overflow:hidden}
    .verse-particle{position:absolute;border-radius:50%;background:rgba(255,244,207,.5);pointer-events:none;animation:drift linear infinite}
    @keyframes drift{from{transform:translateY(0);opacity:0}10%{opacity:.6}90%{opacity:.4}to{transform:translateY(-140px);opacity:0}}
    .verse-ref{display:block;margin-top:26px;color:var(--gold);font-size:11px;letter-spacing:.3em;text-transform:uppercase}
    .worship{background:linear-gradient(180deg,#0b2137,#071525)}
    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:50px}
    .card{min-height:280px;padding:30px;border-radius:22px;border:1px solid var(--line);background:linear-gradient(145deg,rgba(255,255,255,.08),rgba(255,255,255,.025));transition:.35s}
    .card:hover{transform:translateY(-7px);border-color:rgba(214,181,109,.45)}
    .card-icon{font-size:26px;color:var(--gold)}
    .card h3{font-family:Manrope,"Noto Sans KR",sans-serif;font-size:25px;margin-top:65px}
    .card p{color:#91a4b8;line-height:1.7;font-size:13px}
    .events{background:var(--ivory);color:var(--navy)}
    .event-list{margin-top:45px}
    .event-card{display:grid;grid-template-columns:180px 1fr;gap:26px;background:#fff;border:1px solid #dfe4e9;border-radius:18px;overflow:hidden;margin-bottom:18px;transition:.3s}
    .event-card:hover{transform:translateY(-4px);box-shadow:0 20px 45px rgba(7,21,37,.12)}
    .event-img{background:linear-gradient(150deg,#123b63,#0b2137);min-height:150px}
    .event-body{padding:24px 26px 24px 0}
    .event-meta{display:flex;gap:16px;font-size:11px;letter-spacing:.1em;color:#8a7450;margin-bottom:6px}
    .event-body h3{margin:0 0 8px;font-family:Manrope,"Noto Sans KR",sans-serif;font-size:21px}
    .event-body p{margin:0;color:#687687;font-size:13px;line-height:1.6}
    .contact{background:#f7f9fc;color:var(--navy);text-align:center}
    .contact .intro{margin:auto;color:#607084}
    .contact-btn{display:inline-block;margin-top:28px;background:var(--navy);color:white}
    footer{padding:32px 7vw;background:#030d18;color:#7f92a8;font-size:11px}
    footer .foot{max-width:1280px;margin:auto;display:flex;justify-content:space-between;gap:20px;align-items:center}
    .social{display:flex;gap:14px}
    .social a{width:30px;height:30px;border:1px solid rgba(255,255,255,.18);border-radius:50%;display:grid;place-items:center;font-size:13px;transition:.25s}
    .social a:hover{border-color:var(--gold);color:var(--gold)}
    .reveal{opacity:0;transform:translateY(24px);transition:opacity .8s,transform .8s}
    .reveal.visible{opacity:1;transform:none}
    @media(prefers-reduced-motion:reduce){
      .stage{opacity:1;transform:none;filter:none;transition:none}
      .reveal{opacity:1;transform:none}
      .verse-particle{animation:none}
    }
    @media(max-width:800px){
      .links{display:none}.menu{display:block}.hero-grid{grid-template-columns:1fr}.architecture{height:280px}
      .values,.cards,.faith-grid{grid-template-columns:1fr}.event-card{grid-template-columns:1fr}.event-img{min-height:100px}
      section{padding:85px 6vw}.hero{padding:130px 6vw 70px}.welcome .verse{font-size:14px}
      .scroll-note{display:none}footer .foot{flex-direction:column}
      .lang-pick{top:auto;bottom:22px;left:50%;transform:translateX(-50%)}
      .lang-pick .lp-label{display:none}
    }
  </style>
</head>
<body>

  <!-- ===================== OPENING ===================== -->
  <div class="welcome" id="welcome">
    <div class="opening-visual">
      <div class="cloud-layer layer-back"><i></i><i></i><i></i></div>
      <div class="godlight"></div>
      <div class="rays"></div>

      <div class="bell-wrap">
        <svg class="bell-svg" viewBox="0 0 260 300" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="goldBody" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%"  stop-color="#fff6d8"/>
              <stop offset="32%" stop-color="#eecf86"/>
              <stop offset="58%" stop-color="#caa24d"/>
              <stop offset="100%" stop-color="#8a6a2c"/>
            </linearGradient>
            <linearGradient id="goldDark" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#c8a35a"/>
              <stop offset="100%" stop-color="#7a5c24"/>
            </linearGradient>
            <radialGradient id="rimShade" cx="50%" cy="30%" r="75%">
              <stop offset="0%" stop-color="#f6dfa0"/>
              <stop offset="100%" stop-color="#7a5c24"/>
            </radialGradient>
          </defs>

          <!-- chain, rising out of frame -->
          <g stroke="url(#goldDark)" stroke-width="3" fill="none" opacity=".9">
            <path d="M118 0 L118 30 M142 0 L142 30"/>
            <ellipse cx="118" cy="34" rx="7" ry="9"/>
            <ellipse cx="142" cy="34" rx="7" ry="9"/>
            <ellipse cx="118" cy="52" rx="7" ry="9"/>
            <ellipse cx="142" cy="52" rx="7" ry="9"/>
          </g>

          <!-- crown -->
          <ellipse cx="130" cy="66" rx="20" ry="10" fill="url(#goldBody)" stroke="url(#goldDark)" stroke-width="1.5"/>

          <!-- bell body -->

  <script>
  /* ------------------------------ language ------------------------------ */
  (function(){
    const DEFAULT = 'mn';
    const store = {
      get(){ try { return localStorage.getItem('boh-lang'); } catch(e){ return null; } },
      set(v){ try { localStorage.setItem('boh-lang', v); } catch(e){} }
    };
    function pickInitial(){
      const saved = store.get();
      if(saved && window.I18N[saved]) return saved;
      const nav = (navigator.language || '').slice(0,2).toLowerCase();
      if(window.I18N[nav]) return nav;
      return DEFAULT;
    }
    window.setLang = function(lang){
      const dict = window.I18N[lang];
      if(!dict) return;
      document.documentElement.lang = dict._htmlLang;
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const v = dict[el.getAttribute('data-i18n')];
        if(v !== undefined) el.textContent = v;
      });
      document.querySelectorAll('[data-i18n-html]').forEach(el => {
        const v = dict[el.getAttribute('data-i18n-html')];
        if(v !== undefined) el.innerHTML = v;
      });
      document.querySelectorAll('[data-lang]').forEach(b =>
        b.classList.toggle('active', b.getAttribute('data-lang') === lang));
      store.set(lang);
      window.currentLang = lang;
    };
    document.querySelectorAll('[data-lang]').forEach(b =>
      b.addEventListener('click', () => window.setLang(b.getAttribute('data-lang'))));
    window.setLang(pickInitial());
  })();
  </script>

  <script>
  /* -------------------------- opening sequencer -------------------------- *
   * No WebGL, no external library: the visual is plain CSS/SVG, and this
   * script only toggles classes/attributes at fixed times. That keeps the
   * opening's behaviour identical on every browser and device. */
  (function(){
    const welcome  = document.getElementById('welcome');
    const enterBtn = document.getElementById('enter');
    const skipBtn  = document.getElementById('skip');
    const langPick = document.getElementById('langPick');
    const stages   = [...document.querySelectorAll('.stage')];
    const reduced  = matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* Timeline, in ms. */
    const CUE = reduced
      ? { lit:0, bellIn:0, eyebrow:0, title:0, sub:0, strike:0, verse:0, enter:0 }
      : { lit:200, bellIn:900, eyebrow:2600, title:3400, sub:4200, strike:4600, verse:5600, enter:6500 };

    let left = false;
    const timers = [];
    const showCue = name => stages.filter(el => el.dataset.cue === name).forEach(el => el.classList.add('show'));

    function revealControls(){
      skipBtn.classList.add('show');
      langPick.classList.add('show');
    }
    function revealAll(){
      welcome.classList.add('lit', 'bell-in');
      stages.forEach(el => el.classList.add('show'));
      revealControls();
    }
    function run(){
      timers.push(setTimeout(() => welcome.classList.add('lit'),     CUE.lit));
      timers.push(setTimeout(() => welcome.classList.add('bell-in'), CUE.bellIn));
      timers.push(setTimeout(() => showCue('eyebrow'),               CUE.eyebrow));
      timers.push(setTimeout(() => showCue('title'),                 CUE.title));
      timers.push(setTimeout(() => showCue('sub'),                   CUE.sub));
      timers.push(setTimeout(() => {
        welcome.classList.add('struck');
        setTimeout(() => welcome.classList.remove('struck'), 1800);
      }, CUE.strike));
      timers.push(setTimeout(() => showCue('verse'),                 CUE.verse));
      timers.push(setTimeout(() => { showCue('enter'); revealControls(); }, CUE.enter));
      timers.push(setTimeout(revealControls, 1200));
    }

    function leave(){
      if(left) return; left = true;
      timers.forEach(clearTimeout);
      welcome.classList.add('struck');
      setTimeout(() => welcome.classList.add('exit'), 320);
      setTimeout(() => { welcome.remove(); document.body.style.overflow = ''; }, 1700);
    }

    enterBtn.addEventListener('click', leave);
    skipBtn.addEventListener('click', () => { revealAll(); leave(); });
    document.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === 'Escape') leave();
    });

    document.body.style.overflow = 'hidden';

    if(reduced){ revealAll(); } else { run(); }

    /* Absolute safety net: whatever happens, the visitor always gets a way in. */
    setTimeout(revealAll, 9000);
  })();
  </script>

  <script>
  /* ---------------------------- site behaviour --------------------------- */
  const header = document.getElementById('header');
  addEventListener('scroll', () => header.classList.toggle('scrolled', scrollY > 30));
  const io = new IntersectionObserver(
    es => es.forEach(e => { if(e.isIntersecting) e.target.classList.add('visible'); }),
    { threshold: .12 });
  document.querySelectorAll('.reveal').forEach(el => io.observe(el));
  </script>
